    - title: Technology and Digital Pedagogy Coordinator
      institution: NYU Institute of Human Development and Social Change, New York, NY
      year: 2026 - now
      description:
        - Supporting the NYU Prison Education Program's work to close the digital literacy divide in college-in-prison education, in collaboration with the Associate Director of College-in-Prison Programs, Executive Director, and Faculty Director.
        - Assessing and documenting the technological infrastructure supporting incarcerated students — offline intranet systems, computer lab hardware, digital learning platforms, library technologies, and security-approved research tools — and identifying the gaps that limit access to academic materials.
        - Co-designing and implementing surveys, focus groups, and infrastructural assessments with students and faculty to understand digital literacy practices, research strategies, and pedagogical needs inside a college-in-prison context.
        - Building a programmatic knowledge base of approved technologies, technical skills, and offline digital research resources for faculty and students.
        - Partnering with the NYU Division of Libraries, the New York State Department of Corrections and Community Supervision (DOCCS), and peer college-in-prison providers on strategic planning and shared resource development.
        - Developing digital and pedagogical resources for both currently incarcerated students and formerly incarcerated students continuing their education post-release.


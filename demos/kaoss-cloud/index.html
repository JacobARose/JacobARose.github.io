<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaoss Cloud is now Chaos Conductor</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="/demos/chaos-conductor/" />
    <meta http-equiv="refresh" content="0; url=/demos/chaos-conductor/" />
    <script>
      // The old PWA's service worker is scoped to /demos/kaoss-cloud/ and would keep
      // serving the cached app. Unregister it before redirecting.
      (function () {
        var target = "/demos/chaos-conductor/" + location.search + location.hash;
        var go = function () {
          location.replace(target);
        };
        if (!("serviceWorker" in navigator)) return go();
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            return Promise.all(
              regs
                .filter(function (r) {
                  return r.scope.indexOf("/demos/kaoss-cloud/") !== -1;
                })
                .map(function (r) {
                  return r.unregister();
                }),
            );
          })
          .then(go, go);
      })();
    </script>
  </head>
  <body>
    <p>Kaoss Cloud has been renamed to <a href="/demos/chaos-conductor/">Chaos Conductor</a>. Redirecting…</p>
  </body>
</html>
